<script>
"use strict";
// MICROCOSM (FLY IT 7): AirAttack 2 møter Sky Force. Hver stage er sin egen verden.
// Stage 3, Night Streets: en neonby om natten med regn og våt asfalt. Kameraet går lavt mellom husene,
// Kroghs bilder henger som plakater på veggene og på et luftskip, og businessmannen er en kjempe som kommer nedover gata.
// Stage 2, The Deep: du flyr over en strand, kameraet stuper under vann, og havet er fullt av maneter, haier,
// fiskestimer og en hval som passerer, før en breiflabb så stor som skjermen venter på bunnen.
// Versjon 6: alt som står på bakken er laget av Kroghs bilder og figurer, i ekte 3D: skulpturer kledd med utsnitt
// av fotografiene, statuer av de utklipte figurene, og figurene som flåter som seiler over bildene.
// Bakken er et gulv av fotografier i ekte perspektiv (WebGL). Kameraet filmer som i AirAttack: det svinger (yaw),
// stuper ned tett over bildene, stiger høyt opp, ser fram mot horisonten (pitch) og krenger (roll).
// Bygninger og tog reiser seg fra bildene i 3D. Kanonene treffer lufta, bomber treffer bakken.
// Sky Force: oppdrag per sesong, fire vanskelighetsgrader, fire medaljer, mynter, magnet, hangar med åtte oppgraderinger,
// fly å låse opp og kort å samle. Bossene er Kroghs 3D-figurer med kanontårn rundt seg.
// Lufta regnes i virtuelle skjermenheter (360 bred). Bakken har egne enheter og projiseres gjennom kameraet.

const scene = document.getElementById("scene"), cv = document.getElementById("c"), cx = cv.getContext("2d");
const gcv = document.getElementById("bakke");
const VB = 360;
const WW = Math.round(VB * 1.7);  // verdens bredde = ett bilde
const T = WW;                     // bildene er kvadratiske
const OV = Math.round(T * .25);   // overlapp; det fjerneste bildet toner ut over det nærmeste
const STEG = T - OV;
const ETAPPE_BILDER = 15;
const FART = 44;
const FJERN = T * 4.2;            // så langt fram bakken tegnes; resten er dis og himmel
const HAZE = [0.651, 0.686, 0.729]; // samme farge som himmelen ved horisonten (#a6afba)
let VH = 640, SK = 1, DPR = 1;

  { navn: "Teeth in the Garden", bilder: til("bilder02/", ALLE_TI), monstre: ["m_c2b1_1", "m_c2b2_0", "m_c2b3_0", "m_c2b6_0", "m_c2b9_1", "m_c2b9_2"], bosser: ["boss_c2b5", "boss_c2b8", "boss_c2b10"] },
  { navn: "Creature Kingdom", bilder: til("bilder03/", ALLE_TI), monstre: ["m_c3b1_0", "m_c3b3_0", "m_c3b4_0", "m_c3b7_0", "m_c3b8_0", "m_c3b9_0"], bosser: ["boss_c3b2", "boss_c3b5", "boss_c3b10"] },

  { navn: "A Museum of Small Lies", bilder: til("bilder05/", ALLE_TI), monstre: ["m_c5b10_kirsebaer", "m_c5b2_hund", "m_c5b4_bla", "m_c5b4_gra", "m_c5b4_oye", "m_c5b4_rod", "m_c5b6_vesen", "m_c5b7_mann"],

];

const VANSK = [

  { navn: "HARD", hp: 1.6, skudd: 1.3, mynt: 2, farge: "#ffa31a" },

// Stage 2 er havet. Kroghs bilder ligger på havbunnen som sunkne malerier.
SESONGER.splice(1, 0, { navn: "The Deep", dyp: true, bilder: til("bilder05/", ALLE_TI), monstre: [], bosser: [] });
SESONGER.splice(2, 0, { navn: "Night Streets", by: true, bilder: til("bilder04/", ALLE_TI), monstre: ["m_c4b1_1", "m_c4b1_3", "m_c4b3_0", "m_c4b5_0", "m_c4b9_0", "m_c5b7_mann", "m_c3b9_0"], bosser: ["boss_c4b4"], boss3d: "businessmann" });
const KRAV = [0, 0, 0, 3, 7, 12, 18, 24];

const MEDALJER = ["Destroy 70%", "Destroy 100%", "Rescue all", "Untouched"];
// Hangaren: åtte oppgraderinger. Prisen stiger 70 % for hvert nivå.
const OPPG = [
  { id: "hull", navn: "Hull", tekst: "+1 health per level", maks: 5, pris: 150 },
  { id: "kanon", navn: "Main cannon", tekst: "+15% damage, starts stronger", maks: 5, pris: 120 },

  { id: "laser", navn: "Heavy laser", tekst: "Tap for a beam that melts bosses", maks: 5, pris: 300 }
];

// Flyene arver alle oppgraderingene fra hangaren.
const FLY = [
  { id: "kestrel", navn: "Kestrel", tekst: "All-rounder", pris: 0, vinge: "#ffa31a", hull: 0, rate: 1, dmg: 1, str: 1 },
  { id: "ironclad", navn: "Ironclad", tekst: "+3 health, slower guns", pris: 1500, vinge: "#8a9a6a", hull: 3, rate: .85, dmg: 1.1, str: 1.15 },
  { id: "gladius", navn: "Gladius", tekst: "Very fast guns, -1 health", pris: 2500, vinge: "#ff3b5c", hull: -1, rate: 1.45, dmg: .9, str: .92 },
  { id: "pyro", navn: "Pyro", tekst: "Flamethrower: short range, huge damage", pris: 4000, vinge: "#3a3a3a", hull: 1, rate: 1, dmg: 1, str: 1.05, flamme: true }
];
// Kort (Sky Force Reloaded): faller av og til fra fiender, og gjelder for alltid.
const KORT = [
  { id: "rate", navn: "Trigger Happy", tekst: "+10% fire rate" },
  { id: "dmg", navn: "Hot Lead", tekst: "+10% damage" },
  { id: "magnet", navn: "Sticky Stars", tekst: "+40 magnet range" },
  { id: "hull", navn: "Thick Skin", tekst: "+1 health" },
  { id: "bombe", navn: "Big Bang", tekst: "+20% bomb blast" },
  { id: "redning", navn: "Quick Rope", tekst: "Rescue twice as fast" },
  { id: "skjold", navn: "Lucky Start", tekst: "3 s shield at start" },
  { id: "mynt", navn: "Gold Rush", tekst: "Stars sometimes count double" }
];
// Kameraet filmer som i AirAttack: en rekke innstillinger det glir mellom. tilt: vinkel fra loddrett (høy = ser framover),
// yaw: sving, k: skala midt på skjermen (høy = lavt over bakken).
const SCENER = [
  { tilt: .66, yaw: 0, k: .8, t: 8 },        // marsj
  { tilt: .74, yaw: -.34, k: .86, t: 7 },    // sving til venstre
  { tilt: 1.02, yaw: -.08, k: 1.28, t: 6 },  // stup ned tett over bildene
  { tilt: .36, yaw: .06, k: .56, t: 7 },     // stig høyt opp, nesten rett ned
  { tilt: .8, yaw: .36, k: .92, t: 7 },      // sving til høyre
  { tilt: 1.16, yaw: 0, k: 1.1, t: 6 }       // lavt, horisonten synes
];

const BIOM = {
  land: { dis: [0.651, 0.686, 0.729], z: [.7, .95], modus: 0, himmel: "linear-gradient(#5f7590 0%, #8d9db0 38%, #a6afba 52%, #a6afba 100%)" },
  strand: { dis: [.78, .86, .92], z: [.8, 1], modus: 1, himmel: "linear-gradient(#3f86c4 0%, #8fc0e2 40%, #c4dcec 52%, #c4dcec 100%)" },
  hav: { dis: [.02, .13, .2], z: [.3, .42], modus: 2, himmel: "linear-gradient(#0d3550 0%, #06202f 50%, #030f18 100%)" },
  by: { dis: [.09, .06, .15], z: [.45, .6], modus: 3, himmel: "linear-gradient(#170b2a 0%, #2b1546 45%, #170d26 60%, #170d26 100%)" }
};
// Kameraet i gatene: lavt mellom husene.
const BY_SCENER = [
  { tilt: 1.0, yaw: 0, k: 1.25, t: 8 }, { tilt: 1.12, yaw: -.2, k: 1.35, t: 6 },
  { tilt: .82, yaw: .14, k: 1.0, t: 7 }, { tilt: 1.06, yaw: .22, k: 1.3, t: 6 }
];
// Kameraet under vann: nærmere bunnen og mer framover.
const HAV_SCENER = [
  { tilt: 1.12, yaw: 0, k: 1.25, t: 9 }, { tilt: 1.0, yaw: -.2, k: 1.15, t: 7 },
  { tilt: 1.18, yaw: .14, k: 1.3, t: 8 }, { tilt: .9, yaw: .26, k: 1.05, t: 6 }
];
const tilfeldig = a => a[Math.random() * a.length | 0];
function bland(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- lagret fremdrift ----------
let data = { bank: 0, rekord: 0, oppg: {}, fly: { eid: ["kestrel"], valgt: "kestrel" }, kort: [], medaljer: {} };
try { const d = JSON.parse(localStorage.getItem("fly5-data") || "null"); if (d) data = { ...data, ...d, fly: { ...data.fly, ...(d.fly || {}) } }; } catch {}
function lagre() { try { localStorage.setItem("fly5-data", JSON.stringify(data)); } catch {} }
const har = id => data.kort.includes(id);
const nivå = id => data.oppg[id] || 0;
const medaljerFor = (e, v) => (data.medaljer[e] && data.medaljer[e][v]) || [false, false, false, false];
const totalMedaljer = () => { let n = 0; for (const e in data.medaljer) for (const v in data.medaljer[e]) n += data.medaljer[e][v].filter(Boolean).length; return n; };
const stageÅpen = e => totalMedaljer() >= KRAV[e];
const vanskÅpen = (e, v) => v === 0 || medaljerFor(e, v - 1).every(Boolean);

// ---------- tilstand (alt deklareres før noe kjøres) ----------
// tilstand: "meny" (oppdrag), "hangar", "spill", "slutt". fase i spillet: "fly", "boss", "klar".
let nå = 0, tilstand = "meny", pause = false, tidsFaktor = 1, berøring = false;
let camY = 0, camX = 0, fart = FART, skip = null, mods = null, spor = [], kuler = [], missiler = [], fiender = [], fkuler = [], bonuser = [], mynter = [], bomber = [], folk = [];
let partikler = [], ringer = [], tekster = [], ild = [], røyk = [], skyer = [], skyKlokke = 1, materialer = [];
let poeng = 0, tid = 0, bølgeKlokke = 0, bølgeNr = 0, bærerKlokke = 0, rist = 0, blits = 0;
let fliser = [], bakke = [], nesteRad = 0, stokk = [];
let etappe = 0, vansk = 0, valgtStage = 0, valgtVansk = 0, fase = "fly", etappeStartRad = 0, etappeRader = 0, etappeBoss = "", boss = null, banner = null, klarT = 0, st = null;
let sceneI = 0, sceneT = 0, hangarFane = 0, knapper = [], melding = null;
// Biomet styrer bakken, disen og himmelen: "land" (bildene), "strand" (sand og hav), "hav" (havbunnen).
let biom = "land", kystY = 0, dykk = null, bobler = [], snø = [], tang = [], hval = null, bygg = [], lykter = [], regn = [], pynt = [];
let bobX = 0, bobY = 0, bobK = 0, finger = null;
const bølger = {}, taster = {};

// ---------- kamera ----------
const KAM = { tilt: .66, yaw: 0, k: .8, roll: 0, foc: 600, D0: 750, C: [0, 0, 0], R: [1, 0, 0], U: [0, 1, 0], F: [0, 0, -1], L: [0, 0], cr: 1, sr: 0, ctrX: VB / 2, ctrY: 320 };
function oppdaterKamera() {
  const sT = Math.sin(KAM.tilt), cT = Math.cos(KAM.tilt), sP = Math.sin(KAM.yaw), cP = Math.cos(KAM.yaw);
  KAM.foc = VH * 1.15; KAM.D0 = KAM.foc / KAM.k;
  KAM.R = [cP, -sP, 0]; KAM.F = [sP * sT, cP * sT, -cT]; KAM.U = [sP * cT, cP * cT, sT];
  // Kameraet følger flyet sidelengs langs skjermens vannrette retning, selv når det har svingt.
  const lat = camX + VB / 2 - WW / 2;
  KAM.L = [WW / 2 + KAM.R[0] * lat, camY + KAM.R[1] * lat];
  KAM.C = [KAM.L[0] - KAM.F[0] * KAM.D0, KAM.L[1] - KAM.F[1] * KAM.D0, -KAM.F[2] * KAM.D0];
  KAM.cr = Math.cos(KAM.roll); KAM.sr = Math.sin(KAM.roll);
  KAM.ctrX = VB / 2; KAM.ctrY = VH * .5;
}
function prosjiser(X, Y, Z = 0) {
  const C = KAM.C, R = KAM.R, U = KAM.U, F = KAM.F;
  const dx = X - C[0], dy = Y - C[1], dz = Z - C[2];
  const x = dx * R[0] + dy * R[1], y = dx * U[0] + dy * U[1] + dz * U[2], z = dx * F[0] + dy * F[1] + dz * F[2];
  if (z < 8) return null;
  const px = KAM.cr * x - KAM.sr * y, py = KAM.sr * x + KAM.cr * y, k = KAM.foc / z;
  return { x: KAM.ctrX + px * k, y: KAM.ctrY - py * k, s: k, z };
}
function bakkePunkt(sx, sy) {
  const a = (sx - KAM.ctrX) / KAM.foc, b = -(sy - KAM.ctrY) / KAM.foc;
  const x = KAM.cr * a + KAM.sr * b, y = -KAM.sr * a + KAM.cr * b;
  const R = KAM.R, U = KAM.U, F = KAM.F;
  const dx = F[0] + x * R[0] + y * U[0], dy = F[1] + x * R[1] + y * U[1], dz = F[2] + y * U[2];
  if (dz >= -1e-4) return null;
  const t = -KAM.C[2] / dz, p = [KAM.C[0] + t * dx, KAM.C[1] + t * dy];
  return Math.hypot(p[0] - KAM.L[0], p[1] - KAM.L[1]) > FJERN ? null : p;
}
function synligBakke() {
  // Laveste og høyeste bakke-y på skjermen. Over horisonten regnes det som så langt bakken tegnes.
  let lo = Infinity, hi = -Infinity;
  for (const [sx, sy] of [[0, VH + 30], [VB, VH + 30], [VB / 2, VH + 30], [0, VH / 2], [VB, VH / 2], [0, -30], [VB, -30], [VB / 2, -30]]) {
    const p = bakkePunkt(sx, sy);
    const y = p ? p[1] : KAM.L[1] + FJERN;
    lo = Math.min(lo, y); hi = Math.max(hi, y);
  }
  return [lo, Math.min(hi, KAM.L[1] + FJERN)];
}
function filmKamera(dt) {
  // Velg innstilling: egen for bossen og stage-slutt, ellers rundgang gjennom scenene.
  let mål;
  let fort = false;
  if (tilstand === "spill" && dykk) { mål = dykk.t < 1.9 ? { tilt: .1, yaw: 0, k: 1.35 } : { tilt: 1.12, yaw: 0, k: 1.25 }; fort = true; }
  else if (tilstand === "spill" && krakenAktiv()) mål = { tilt: 1.05, yaw: Math.sin(nå * .3) * .08, k: .95 };
  else if (tilstand === "spill" && biom === "strand") mål = { tilt: 1.12, yaw: Math.sin(nå * .2) * .12, k: .95 };
  else if (tilstand === "spill" && fase === "boss" && biom === "hav") mål = { tilt: .74, yaw: 0, k: .9 };
  else if (tilstand === "spill" && fase === "boss" && biom === "by") mål = { tilt: .9, yaw: 0, k: 1.0 };
  else if (tilstand === "spill" && fase === "boss") mål = { tilt: .7, yaw: 0, k: .74 };
  else if (tilstand === "spill" && fase === "klar") mål = { tilt: .98, yaw: Math.sin(nå * .3) * .45, k: .95 };
  else { const L = biom === "hav" ? HAV_SCENER : biom === "by" ? BY_SCENER : SCENER; sceneT += dt; if (sceneT > L[sceneI % L.length].t) { sceneT = 0; sceneI = (sceneI + 1) % L.length; } mål = L[sceneI % L.length]; }
  const glatt = Math.min(1, dt * (fort ? 2.2 : .55)), gYaw = KAM.yaw;
  KAM.tilt += (mål.tilt + (skip && tilstand === "spill" ? (skip.y / VH - .7) * .1 : 0) - KAM.tilt) * glatt;
  KAM.yaw += (mål.yaw - KAM.yaw) * glatt;
  KAM.k += (mål.k - KAM.k) * glatt;
  // Krenger inn i svingene, og med flyet.
  const yawFart = (KAM.yaw - gYaw) / Math.max(dt, 1e-3);
  let mRoll = -yawFart * 1.4;
  if (skip && tilstand === "spill") mRoll += -(skip.krenge + bobK * .5) * .1 - ((skip.x - camX) - VB / 2) / VB * .16;
  KAM.roll += (mRoll - KAM.roll) * Math.min(1, dt * 3);
  // Flyet vises fra samme vinkel som kameraet: ovenfra, eller bakfra når kameraet ligger lavt under vann.
  const vMål = biom === "hav" ? Math.max(0, Math.min(1, (KAM.tilt - .55) / .5)) : Math.max(0, Math.min(.4, (KAM.tilt - .85) / .7));
  skipVipp += (vMål - skipVipp) * Math.min(1, dt * 4);
}
let skipVipp = 0;

// ---------- WebGL-bakken ----------
let gl = null, glProg = null, glBuf = null, glLoc = {}, aniso = null;
function lagGL() {
  try { gl = gcv.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: true, depth: true }); } catch { gl = null; }
  if (!gl) return;
  const vs = `attribute vec2 aP; attribute vec2 aT;
    uniform vec3 uC; uniform vec3 uR; uniform vec3 uU; uniform vec3 uF; uniform vec2 uRoll; uniform float uFoc; uniform vec2 uCtr; uniform vec2 uView;
    varying vec2 vT; varying float vZ; varying vec2 vW;
    void main() {
      vW = aP;
      vec3 d = vec3(aP, 0.0) - uC;
      float x = dot(d, uR), y = dot(d, uU), z = dot(d, uF);
      float px = uRoll.x * x - uRoll.y * y, py = uRoll.y * x + uRoll.x * y;
      vec2 s = uCtr + vec2(px, -py) * uFoc / z;
      vec2 n = vec2(s.x / uView.x * 2.0 - 1.0, 1.0 - s.y / uView.y * 2.0);
      gl_Position = vec4(n * z, 0.0, z);
      vT = aT; vZ = z;
    }`;
  const fs = `precision mediump float;
    uniform sampler2D uTex; uniform sampler2D uTex2; uniform float uMork; uniform vec3 uDis; uniform vec2 uZ; uniform float uModus; uniform float uTid; uniform float uKyst;
    varying vec2 vT; varying float vZ; varying vec2 vW;
    void main() {
      vec4 c;
      if (uModus < 0.5) c = texture2D(uTex, vT);
      else {
