# Builds the DRIFT SONATA plugin: VST3, Audio Unit and a standalone app on a Mac (one build for Apple silicon and
# Intel), VST3 and the app on Windows and Linux. The builds are kept as downloads on each run.
name: DRIFT SONATA plugin

on:
  push:
    paths: ['drift-sonata/dsp/**', 'drift-sonata/plugin/**', '.github/workflows/drift-sonata-plugin.yml']
  pull_request:
    paths: ['drift-sonata/dsp/**', 'drift-sonata/plugin/**', '.github/workflows/drift-sonata-plugin.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: windows-latest
            name: windows
            extra: ''
          - os: ubuntu-24.04
            name: linux
            extra: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgl-dev
      - name: Configure
        run: cmake -S drift-sonata/plugin -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: drift-sonata-${{ matrix.name }}
          path: |
            build/DriftSonata_artefacts/Release/VST3
            build/DriftSonata_artefacts/Release/AU
            build/DriftSonata_artefacts/Release/Standalone
            build/DriftSonata_artefacts/VST3
            build/DriftSonata_artefacts/Standalone
          if-no-files-found: warn
